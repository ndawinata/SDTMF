name: test
on:
  push:
  pull_request:

jobs:
  official-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Python
        run: python3 python/test_sdtmf.py
      - name: JavaScript
        run: node js/test.js
      - name: C
        run: |
          gcc -O2 -Wall -Wextra -Werror -I c/src \
            c/extras/test_sdtmf.c c/src/sdtmf.c c/src/sha256.c \
            -o /tmp/test_sdtmf
          /tmp/test_sdtmf
      - name: Go
        run: go test
        working-directory: go
